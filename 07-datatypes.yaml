- name: data types in ansible
  hosts: local
  connection: local
  vars:
    Course: "DevOps with AWS"
    Duration: 140
    is_worth: yes
    tools: #["linux", "Shell", "Ansible"]
    - "linux"
    - "Shell"
    - "Ansible"
    concepts:
      cloud: aws
      iac: terraform
      container_orchestration: k8s
  tasks:
  - name: print course high level details
    ansible.builtin.debug:
      msg: "Course name: {{Course}} is really worth: {{is_worth}} tools and concepts used are {{tools}} \n {{concepts}}" 