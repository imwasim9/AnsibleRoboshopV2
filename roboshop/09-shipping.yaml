- name: set up and configure shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: install maven 3.5
    ansible.builtin.dnf:
      name: "{{item}}"
      state: present
    loop:
    - maven
    - mysql

  - name: install pymysql and cryptography using pip
    ansible.builtin.pip:
      name: "{{item}}"
      executable: pip3.9
    loop:
    - PyMySQL
    - cryptography
  
  - name: create system user
    ansible.builtin.user:
      name: roboshop
      system: true
      shell: /sbin/nologin
      home: /app
  
  - name: remove zip file if already exists
    ansible.builtin.file:
      path: /tmp/shipping.zip
      state: absent

  - name: download shipping application always for new updates if any
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
      dest: /tmp/shipping.zip
  
  - name: remove app directory if exists
    ansible.builtin.file:
      path: /app
      state: absent
  
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: extract shipping application
    ansible.builtin.unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: run maven package by moving to /app dir
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app  

  - name: move shipping jar file form target to /app dir
    ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar 
    args:
      chdir: /app

  - name: copy shipping service
    ansible.builtin.copy:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service

  - name: import data into mysql
    ansible.mysql.mysql_db:
      state: import
      name: all
      login_host: mysql.wasdaws.cyou
      login_user: root
      login_password: pRoboShop@1
      target: "{{ item }}"
    loop:
    - /app/db/schema.sql
    - /app/db/app-user.sql 
    - /app/db/master-data.sql

  - name: enable daemon-reload and start service
    ansible.builtin.systemd_service:
      name: shipping
      enable: true
      daemon-relaod: true
      state: started
      