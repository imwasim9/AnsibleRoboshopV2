- name: setup and configure dispatch service
  hosts: dispatch
  become: true
  tasks:
  - name: install golang
    ansible.builtin.command: dnf install golang -y
  
  - name: install maven 3.5
    ansible.builtin.dnf:
      name: maven
      state: present
  
  - name: create system user
    ansible.builtin.user:
      name: roboshop
      system: true
      shell: /sbin/nologin
      home: /app
      comment: RoboShop System user
  
  - name: remove zip file if already exists
    ansible.builtin.file:
      path: /tmp/dispatch.zip
      state: absent

  - name: download dispatch application always for new updates if any
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/dispatch-v3.zip
      dest: /tmp/dispatch.zip
  
  - name: remove app directory if exists
    ansible.builtin.file:
      path: /app
      state: absent
  
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: extract dispatch application
    ansible.builtin.unarchive:
      src: /tmp/dispatch.zip
      dest: /app
      remote_src: yes

  - name: run maven package by moving to /app dir
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app  

  - name: move dispatch jar file form target to /app dir
    ansible.builtin.command: mv target/dispatch-1.0.jar dispatch.jar 
    args:
      chdir: /app

  - name: copy dispatch service
    ansible.builtin.copy:
      src: dispatch.service
      dest: /etc/systemd/system/dispatch.service

  - name: install dependencies by go mod init and build
    ansible.builtin.command: "{{ item }}"
    args:
      chdir: /app
    loop: 
    - go mod init dispatch
    - go get
    - go build
  
  - name: daemon-reload, enable and start service
    ansible.builtin.systemd_service:
      name: dispatch
      enabled: true
      daemon-reload: true
      state: started