  - name: copy rabbitmq repo to /etc/yum.repos.d/
    ansible.builtin.copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo

  - name: install rabbimq-server
    ansible.builtin.package:
      name: rabbitmq-server
      state: present
  
  - name: enable and start rabbitmq
    ansible.builtin.service:
      name: rabbitmq-server
      enabled: yes
      state: started

  - name: create rabbitmq system user and set all permissions
    community.rabbitmq.rabbitmq_user:
      user: roboshop 
      password: roboshop123
      permissions:
      - vhost: /
        configure_priv: .*
        read_priv: .*
        write_priv: .*
      state: present